<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settlement — Foodbridge Settlement (session-02 prototype)</title>
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
  <div id="content"></div>
  <script src="seed.js"></script>
  <script src="app.js"></script>
  <script>
    let STORE = null, AUDIT = null, ITEMS = [], SETTLED = false;

    function persist() { AUDIT.updatedAt = nowIso(); saveStore(STORE); }

    function resLineHtml(p) {
      const c = computeRow(p);
      const cls = classify(p);
      const opts = resolutionOptionsFor(STORE, cls);
      const r = p.resolution || {};
      const selId = r.optionId || (opts[0] && opts[0].id);
      const sel = resolutionOption(STORE, cls, selId) || {};
      const resolved = r.status === 'resolved';
      const optionsHtml = opts.map((o) => `<option value="${o.id}" ${o.id === selId ? 'selected' : ''}>${o.label}</option>`).join('');
      const controls = SETTLED ? `
        <div class="help">Resolution: <strong>${(resolutionOption(STORE, cls, r.optionId) || {}).label || '—'}</strong>${r.note ? ' · ' + r.note : ''}</div>`
        : `
        <div class="res-controls">
          <div class="field"><label>Resolution</label><select class="resSel" data-pid="${p.productId}">${optionsHtml}</select></div>
          <div class="split-fields ${sel.split ? 'on' : ''}" data-pid="${p.productId}">
            <div class="field"><label>Recover qty</label><input type="number" class="resRecover" min="0" step="0.001" value="${r.recoveredQty || ''}" /></div>
            <div class="field"><label>Write-off qty</label><input type="number" class="resWrite" min="0" step="0.001" value="${r.writeOffQty || ''}" /></div>
          </div>
          <div class="field grow" style="min-width:220px"><label>Note</label><input type="text" class="resNote" value="${r.note || ''}" placeholder="optional" /></div>
        </div>
        <div class="actions-row" style="justify-content:flex-start">
          <button class="btn sm ticketBtn" data-pid="${p.productId}" ${sel.ticket ? '' : 'style="display:none"'}>${r.ticketId ? 'Ticket ' + r.ticketId + ' ✓' : '＋ Create Recovery Ticket'}</button>
          <button class="btn sm keepBtn" data-pid="${p.productId}">Keep Pending</button>
          <button class="btn sm primary resolveBtn" data-pid="${p.productId}">Resolve</button>
        </div>`;
      return `<div class="res-line ${resolved ? 'resolved' : ''}" id="line-${p.productId}">
        <div class="rl-head">
          <div><strong>${p.name}</strong> <span class="sub mono">· ${p.batchNo} · ${p.location}</span>
            <div style="margin-top:.3rem"><span class="badge st-under_review">${cls}</span></div></div>
          <div>${resolved ? statusBadge('resolved') : statusBadge('pending_review')}${r.ticketId ? ' <a class="mono" href="ticket-detail.html?id=' + r.ticketId + '">' + r.ticketId + '</a>' : ''}</div>
        </div>
        <div class="rl-nums">
          <span class="n">Expected <b>${fmtQty(p.expected)}</b></span>
          <span class="n">Actual <b>${fmtQty(num(p.actual))}</b></span>
          <span class="n">Missing <b>${fmtQty(c.missing || 0)}</b></span>
          <span class="n">Extra <b>${fmtQty(num(p.extra))}</b></span>
          <span class="n">Variance <b>${(c.variance < 0 ? '' : '+') + fmtQty(c.variance)}</b></span>
        </div>
        ${p.reasonNarrative ? `<div class="reason">${p.reasonNarrative}</div>` : ''}
        <div class="evidence">${(p.evidence && ((p.evidence.photos || []).length + (p.evidence.documents || []).length)) ?
          [].concat((p.evidence.photos || []).map((x) => `<span class="ev-chip">📷 ${x.caption || 'Photo'}</span>`), (p.evidence.documents || []).map((x) => `<span class="ev-chip">📄 ${x.name}</span>`)).join('') :
          '<span class="notice">No evidence</span>'}</div>
        ${controls}
      </div>`;
    }

    function render() {
      SETTLED = ['approved', 'closed'].includes(AUDIT.status);
      ITEMS = (AUDIT.products || []).filter(needsResolution);
      const t = auditTotals(AUDIT);
      const resolvedCount = ITEMS.filter((p) => (p.resolution || {}).status === 'resolved').length;
      const body = `
        <a class="back-link" href="settlement.html">← Settlement Queue</a>
        <div class="page-head">
          <div><h1 style="display:flex;align-items:center;gap:.6rem">Settle: ${AUDIT.name} ${statusBadge(AUDIT.status)}</h1>
            <div class="sub mono">${AUDIT.id} · ${warehouseName(STORE, AUDIT.warehouseId)} · ${entityChip(AUDIT.entity)} · Auditor: ${userName(STORE, AUDIT.auditorUserId)}</div></div>
          <div class="head-actions">
            ${SETTLED ? '<span class="lock-note" style="color:var(--green);background:var(--green-bg)">✓ Settled</span>' :
              '<button class="btn" id="keepBtn">Keep in Settlement</button><button class="btn primary" id="settleBtn">Settle Audit</button>'}
          </div>
        </div>
        <div class="kpi-row" id="kpis"></div>
        <div class="help" style="margin:-.4rem 0 1rem">${SETTLED ? 'This audit has been settled. A stock snapshot runs in the background (not shown here).' :
          `${resolvedCount}/${ITEMS.length} variance items resolved. On <strong>Settle</strong>, recovery/return resolutions become Recovery Action Tickets; a stock snapshot runs in the background.`}</div>
        <h2 class="section-title" style="margin-top:0">Variance items <span class="sub">(${ITEMS.length})</span></h2>
        <div id="lines"></div>`;
      document.getElementById('content').innerHTML = body;

      const kpi = (tile, icon, label, value) => `<div class="kpi"><div class="top"><div class="tile ${tile}">${svg(icon)}</div><div class="label">${label}</div></div><div class="value">${value}</div></div>`;
      // build after shell too; store for re-use
      window._kpiHtml = kpi('orange', 'chart', 'Net Variance', `<span class="${t.variance < 0 ? 'neg' : t.variance > 0 ? 'pos' : 'zero'}">${fmtQty(t.variance)}</span>`) +
        kpi('red', 'list', 'Missing', `<span class="neg">${fmtQty(t.missing)}</span>`) +
        kpi('green', 'plus', 'Extra', `<span class="pos">${fmtQty(t.extra)}</span>`) +
        kpi('blue', 'box', 'Items to Resolve', ITEMS.length);
    }

    function renderLines() {
      const host = document.getElementById('lines');
      if (!AUDIT.products || !AUDIT.products.length) { host.innerHTML = '<section class="panel"><div class="empty">No variance line items are seeded for this audit in the prototype.</div></section>'; return; }
      if (!ITEMS.length) { host.innerHTML = '<section class="panel"><div class="empty">✓ This audit balances — no variance items to resolve.</div></section>'; return; }
      host.innerHTML = ITEMS.map(resLineHtml).join('');
      if (SETTLED) return;
      host.querySelectorAll('.resSel').forEach((sel) => sel.addEventListener('change', () => {
        const pid = sel.dataset.pid; const p = AUDIT.products.find((x) => x.productId === pid); const cls = classify(p);
        const opt = resolutionOption(STORE, cls, sel.value) || {};
        host.querySelector(`.split-fields[data-pid="${pid}"]`).classList.toggle('on', !!opt.split);
        const tb = host.querySelector(`.ticketBtn[data-pid="${pid}"]`); tb.style.display = opt.ticket ? '' : 'none';
      }));
      host.querySelectorAll('.resolveBtn').forEach((b) => b.addEventListener('click', () => setResolution(b.dataset.pid, 'resolved')));
      host.querySelectorAll('.keepBtn').forEach((b) => b.addEventListener('click', () => setResolution(b.dataset.pid, 'pending')));
      host.querySelectorAll('.ticketBtn').forEach((b) => b.addEventListener('click', () => createTicketFor(b.dataset.pid)));
    }

    function readLine(pid) {
      const host = document.getElementById('lines');
      const sel = host.querySelector(`.resSel[data-pid="${pid}"]`);
      const line = document.getElementById('line-' + pid);
      return {
        optionId: sel.value,
        recoveredQty: Number(line.querySelector('.resRecover') ? line.querySelector('.resRecover').value : 0) || 0,
        writeOffQty: Number(line.querySelector('.resWrite') ? line.querySelector('.resWrite').value : 0) || 0,
        note: (line.querySelector('.resNote') || {}).value || '',
      };
    }

    function setResolution(pid, status) {
      const p = AUDIT.products.find((x) => x.productId === pid);
      const data = readLine(pid);
      p.resolution = Object.assign({}, p.resolution, data, { status });
      persist(); renderLines(); refreshKpis();
      toast(status === 'resolved' ? 'Item resolved.' : 'Item kept pending.');
    }

    function createTicketFor(pid) {
      const p = AUDIT.products.find((x) => x.productId === pid);
      const data = readLine(pid);
      p.resolution = Object.assign({}, p.resolution, data);
      if (p.resolution.ticketId) { location.href = 'ticket-detail.html?id=' + p.resolution.ticketId; return; }
      const cls = classify(p);
      const opt = resolutionOption(STORE, cls, data.optionId) || {};
      const id = nextSeqId(STORE.actionTickets, 'AT-2405-');
      STORE.actionTickets.unshift({
        id, auditId: AUDIT.id, productId: pid, warehouseId: AUDIT.warehouseId, entity: AUDIT.entity,
        title: `${opt.label || 'Recovery'} — ${p.name}`,
        description: `Auto-created from settlement of ${AUDIT.id}. ${cls} on ${p.name} (${p.batchNo}). ${p.reasonNarrative || ''}`.trim(),
        status: 'open', priority: cls === 'MISSING' ? 'high' : 'medium',
        assignedToUserId: AUDIT.auditorUserId, createdByUserId: STORE.currentUser.id, createdAt: nowIso(),
        comments: [],
      });
      p.resolution.ticketId = id;
      persist(); renderLines();
      toast('Recovery ticket ' + id + ' created & assigned.');
    }

    function refreshKpis() { const el = document.getElementById('kpis'); if (el) el.innerHTML = window._kpiHtml; }

    function doSettle() {
      const unaddressed = ITEMS.filter((p) => !(p.resolution && p.resolution.optionId));
      if (unaddressed.length) { toast(`Choose a resolution for all ${ITEMS.length} items first (${unaddressed.length} left).`); return; }
      const pending = ITEMS.filter((p) => (p.resolution || {}).status !== 'resolved');
      const finish = () => {
        // auto-create tickets for ticket-type resolutions lacking one
        let made = 0;
        ITEMS.forEach((p) => {
          const opt = resolutionOption(STORE, classify(p), p.resolution.optionId) || {};
          if (opt.ticket && !p.resolution.ticketId) { createTicketSilently(p, opt); made++; }
          if ((p.resolution || {}).status !== 'resolved') p.resolution.status = 'resolved';
        });
        AUDIT.status = 'approved'; persist();
        toast(`Settled${made ? ' — ' + made + ' recovery ticket(s) created' : ''}. Snapshot runs in background.`);
        setTimeout(() => location.href = 'settlement.html', 1300);
      };
      if (pending.length) {
        openModal('Settle with pending items?', `<p>${pending.length} item(s) are not marked resolved. Settling will finalize them; any recovery/return items become Recovery Action Tickets.</p>`,
          `<button class="btn ghost" id="cxl">Go back</button><button class="btn primary" id="ok">Settle anyway</button>`);
        document.getElementById('cxl').addEventListener('click', closeModal);
        document.getElementById('ok').addEventListener('click', () => { closeModal(); finish(); });
      } else finish();
    }
    function createTicketSilently(p, opt) {
      const id = nextSeqId(STORE.actionTickets, 'AT-2405-');
      STORE.actionTickets.unshift({ id, auditId: AUDIT.id, productId: p.productId, warehouseId: AUDIT.warehouseId, entity: AUDIT.entity,
        title: `${opt.label} — ${p.name}`, description: `Auto-created on settle of ${AUDIT.id}. ${classify(p)} on ${p.name}.`,
        status: 'open', priority: classify(p) === 'MISSING' ? 'high' : 'medium', assignedToUserId: AUDIT.auditorUserId,
        createdByUserId: STORE.currentUser.id, createdAt: nowIso(), comments: [] });
      p.resolution.ticketId = id;
    }

    loadStore().then((s) => {
      STORE = s;
      AUDIT = byId(s.audits, qp('id', '')) || s.audits[0];
      render();
      renderShell('settlement-queue', { user: s.currentUser, crumbs: [
        { label: 'Settlement Queue', href: 'settlement.html' }, { label: AUDIT.id },
      ] });
      refreshKpis();
      renderLines();
      const sb = document.getElementById('settleBtn'); if (sb) sb.addEventListener('click', doSettle);
      const kb = document.getElementById('keepBtn'); if (kb) kb.addEventListener('click', () => { if (AUDIT.status === 'submitted') { AUDIT.status = 'under_review'; persist(); } toast('Kept in settlement.'); setTimeout(() => location.href = 'settlement.html', 800); });
    });
  </script>
</body>
</html>
