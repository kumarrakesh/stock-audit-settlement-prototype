<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Detail — Foodbridge Settlement (session-02 prototype)</title>
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
  <div id="content"></div>
  <script src="seed.js"></script>
  <script src="app.js"></script>
  <script>
    let STORE = null, AUDIT = null, P = null, EDIT = null;
    const backHref = () => 'audit-detail.html?id=' + AUDIT.id;

    function fieldInput(field, label) {
      const v = P[field]; const dis = EDIT.readonly ? 'disabled' : '';
      const val = (v === null || v === undefined) ? '' : v;
      return `<div class="field"><label>${label} (Base Unit)</label>
        <input type="number" min="0" step="0.001" id="f_${field}" value="${val}" ${dis} /></div>`;
    }

    function skeleton() {
      return `
        <a class="back-link" href="${backHref()}">← ${AUDIT.id} · ${AUDIT.name}</a>
        <div class="page-head">
          <div>
            <h1 style="display:flex;align-items:center;gap:.6rem">${P.name} <span id="hStatus"></span></h1>
            <div class="sub mono">SKU: ${P.sku} · Batch: ${P.batchNo} · Location: ${P.location}</div>
          </div>
          <div class="head-actions">
            ${EDIT.readonly ? '<span class="lock-note">🔒 ' + labelize(AUDIT.status) + ' — read only</span>'
              : '<button class="btn" id="saveBtn">Save</button><button class="btn primary" id="saveNextBtn">Save &amp; Next</button>'}
          </div>
        </div>

        <div class="grid-2">
          <section class="panel"><div class="card-pad">
            <h2 class="section-title" style="margin-top:0">Physical count</h2>
            <div class="form-grid">
              <div class="field"><label>Expected (Base Unit)</label><input type="number" value="${P.expected}" disabled /></div>
              ${fieldInput('actual', 'Actual (good)')}
              ${fieldInput('expired', 'Expired')}
              ${fieldInput('waste', 'Waste')}
              ${fieldInput('extra', 'Extra')}
            </div>
            <div class="help">ⓘ Actual + Expired + Waste must be ≤ Expected + Extra. <span id="validNote"></span></div>

            <h2 class="section-title">Reason / notes</h2>
            <textarea id="reason" placeholder="Explain any variance — cause, batch, handling…" ${EDIT.readonly ? 'disabled' : ''}>${P.reasonNarrative || ''}</textarea>

            <h2 class="section-title">Evidence</h2>
            <div class="evidence" id="evidence"></div>
            ${EDIT.readonly ? '' : `<div class="actions-row" style="justify-content:flex-start;margin-top:.6rem">
              <button class="btn sm" id="addPhoto">📷 Add photo</button>
              <button class="btn sm" id="addDoc">📄 Add document</button></div>`}
          </div></section>

          <section class="panel"><div class="card-pad">
            <h2 class="section-title" style="margin-top:0">Derived</h2>
            <div class="meta-grid" style="grid-template-columns:1fr 1fr">
              <div><div class="k">Missing</div><div class="v" id="dMissing">—</div></div>
              <div><div class="k">Variance</div><div class="v" id="dVariance">—</div></div>
              <div><div class="k">Status</div><div class="v" id="dStatus">—</div></div>
              <div><div class="k">Classification</div><div class="v" id="dClass">—</div></div>
            </div>
            <div class="help" style="margin-top:1rem">Missing = max(Expected − (Actual+Expired+Waste), 0). Variance = Extra − Missing (− = shortfall). <em>Prototype model — not ratified.</em></div>
          </section></div>
        </div>`;
    }

    function readInputs() {
      if (EDIT.readonly) return;
      const g = (f) => { const el = document.getElementById('f_' + f); return el.value === '' ? null : Number(el.value); };
      P.actual = g('actual');
      if (P.actual === null) { P.expired = null; P.waste = null; P.extra = null; }
      else { P.expired = g('expired') || 0; P.waste = g('waste') || 0; P.extra = g('extra') || 0; }
      P.reasonNarrative = document.getElementById('reason').value.trim();
    }

    function renderDerived() {
      const c = computeRow(P);
      document.getElementById('hStatus').innerHTML = statusBadge(c.counted ? c.status : 'not_counted');
      document.getElementById('dStatus').innerHTML = statusBadge(c.counted ? c.status : 'not_counted');
      document.getElementById('dMissing').innerHTML = c.missing === null ? '—' : (c.missing > 0 ? '<span class="neg">' + fmtQty(c.missing) + '</span>' : '<span class="zero">0.000</span>');
      document.getElementById('dVariance').innerHTML = varianceCell(c.variance);
      document.getElementById('dClass').innerHTML = c.counted && c.variance !== 0 ? `<span class="badge st-under_review">${classify(P)}</span>` : '<span class="notice">—</span>';
      document.getElementById('validNote').innerHTML = c.valid ? '' : '<span class="neg">Balance rule violated.</span>';
    }

    function renderEvidence() {
      const ev = P.evidence || { photos: [], documents: [] };
      const chips = [].concat(
        (ev.photos || []).map((x) => `<span class="ev-chip">📷 ${x.caption || 'Photo'}</span>`),
        (ev.documents || []).map((x) => `<span class="ev-chip">📄 ${x.name || 'Document'}</span>`));
      document.getElementById('evidence').innerHTML = chips.length ? chips.join('') : '<span class="notice">No evidence captured.</span>';
    }

    function save(next) {
      readInputs();
      const c = computeRow(P);
      if (!c.valid) { toast('Balance rule violated — Actual + Expired + Waste exceeds Expected + Extra.'); return; }
      AUDIT.updatedAt = nowIso(); saveStore(STORE);
      if (next) {
        const rest = AUDIT.products.filter((x) => x.productId !== P.productId && !computeRow(x).counted);
        if (rest.length) { location.href = `product-detail.html?auditId=${AUDIT.id}&productId=${rest[0].productId}`; return; }
        toast('All products counted. Back to audit.'); setTimeout(() => location.href = backHref(), 900); return;
      }
      toast('Saved.'); setTimeout(() => location.href = backHref(), 700);
    }

    loadStore().then((s) => {
      STORE = s;
      AUDIT = byId(s.audits, qp('auditId', '')) || s.audits[0];
      P = (AUDIT.products || []).find((x) => x.productId === qp('productId', '')) || (AUDIT.products || [])[0];
      EDIT = auditEditable(AUDIT);
      if (!P) { document.getElementById('content').innerHTML = '<a class="back-link" href="' + backHref() + '">← Back</a><section class="panel"><div class="empty">Product not found.</div></section>'; renderShell('audit-sessions', { user: s.currentUser, crumbTitle: 'Product' }); return; }

      document.getElementById('content').innerHTML = skeleton();
      renderShell('audit-sessions', { user: s.currentUser, crumbs: [
        { label: 'Audit Sessions', href: 'audit-sessions.html' },
        { label: AUDIT.id, href: backHref() },
        { label: P.name },
      ] });
      renderDerived();
      renderEvidence();

      if (!EDIT.readonly) {
        ['actual', 'expired', 'waste', 'extra'].forEach((f) => document.getElementById('f_' + f).addEventListener('input', () => { readInputs(); renderDerived(); }));
        document.getElementById('saveBtn').addEventListener('click', () => save(false));
        document.getElementById('saveNextBtn').addEventListener('click', () => save(true));
        document.getElementById('addPhoto').addEventListener('click', () => { P.evidence = P.evidence || { photos: [], documents: [] }; P.evidence.photos = P.evidence.photos || []; P.evidence.photos.push({ caption: 'Photo ' + (P.evidence.photos.length + 1) }); renderEvidence(); toast('Photo attached (simulated).'); });
        document.getElementById('addDoc').addEventListener('click', () => { P.evidence = P.evidence || { photos: [], documents: [] }; P.evidence.documents = P.evidence.documents || []; P.evidence.documents.push({ name: 'document-' + (P.evidence.documents.length + 1) + '.pdf', size: '—' }); renderEvidence(); toast('Document attached (simulated).'); });
      }
    });
  </script>
</body>
</html>
