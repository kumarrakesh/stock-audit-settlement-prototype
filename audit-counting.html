<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting…</title>
  <script>
    // The counting grid was replaced by the Audit Detail → Product Detail flow in this iteration.

    location.replace('audit-detail.html' + (id ? '?id=' + encodeURIComponent(id) : ''));
  </script>
</head>
