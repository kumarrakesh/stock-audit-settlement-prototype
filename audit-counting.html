<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audit Counting — Foodbridge Settlement (session-02 prototype)</title>
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
  <div id="content"></div>

  <script src="seed.js"></script>
  <script src="app.js"></script>
  <script>
    const PAGE_SIZE = 6;
    let STORE = null, AUDIT = null, cState = { q: '', location: '', batch: '', status: 'all', page: 1 };

    function persist() { AUDIT.updatedAt = nowIso(); saveStore(STORE); }

    function missingPanel() {
      return `
        <div class="page-head">
          <div><h1>Audit Counting</h1><div class="sub">${AUDIT.name}</div></div>
          <div class="head-actions"><a class="btn" href="audit-sessions.html">← Back to Audit Sessions</a></div>
        </div>
        <section class="panel" style="margin-top:1.25rem"><div class="card-pad">
          <p><strong>${AUDIT.id}</strong> — ${warehouseName(STORE, AUDIT.warehouseId)} · ${entityChip(AUDIT.entity)} · ${statusBadge(AUDIT.status)}</p>
          <p class="sub">Line-item counting for this audit isn’t wired in the session-02 prototype — only
          <a href="audit-counting.html?id=AUD-2405-012">AUD-2405-012</a> carries a full count grid.
          The list, filters, dashboard, and this session’s metadata are all live.</p>
        </div></section>`;
    }

    function skeleton() {
      const paused = AUDIT.status === 'paused';
      return `
        <div class="page-head">
          <div>
            <h1 style="display:flex;align-items:center;gap:.6rem">Audit Counting ${statusBadge(AUDIT.status)}</h1>
            <div class="sub">${AUDIT.name}</div>
            <div class="sub" style="margin-top:.5rem">
              🏠 <strong>Warehouse:</strong> ${warehouseName(STORE, AUDIT.warehouseId)} &nbsp;·&nbsp;
              📦 <strong>Entity:</strong> ${entityName(STORE, AUDIT.entity)} &nbsp;·&nbsp;
              📅 <strong>Audit Date:</strong> ${AUDIT.auditDate || '—'} &nbsp;·&nbsp;
              👤 <strong>Auditor:</strong> ${userName(STORE, AUDIT.auditorUserId)}
            </div>
          </div>
          <div class="head-actions">
            <button class="btn" id="saveBtn">Save Draft</button>
            <button class="btn" id="pauseBtn">${paused ? 'Resume Audit' : 'Pause Audit'}</button>
            <button class="btn primary" id="submitBtn">Review &amp; Submit</button>
          </div>
        </div>

        <div class="kpi-row" id="kpis"></div>

        <section class="panel">
          <div class="card-pad" style="border-bottom:1px solid var(--line)">
            <div class="filter-actions">
              <div class="search-wrap grow">${svg('search')}<input type="search" id="cSearch" placeholder="Search by product name / code / SKU / batch..." /></div>
              <select id="cLocation" style="max-width:150px"></select>
              <select id="cBatch" style="max-width:160px"></select>
              <select id="cStatus" style="max-width:160px">
                <option value="all">All Statuses</option>
                <option value="counted">Counted</option>
                <option value="partially_counted">Partially Counted</option>
                <option value="not_counted">Not Counted</option>
              </select>
              <button class="btn ghost" id="cClear">Clear</button>
            </div>
          </div>
          <div class="table-wrap"><table>
            <thead><tr>
              <th>Product Details</th><th>Batch No.</th><th>Location</th>
              <th class="num">Expected</th><th class="num">Actual *</th><th class="num">Expired</th>
              <th class="num">Waste</th><th class="num">Extra</th><th class="num">Missing</th>
              <th class="num">Variance</th><th>Status</th><th></th>
            </tr></thead>
            <tbody id="grid"></tbody>
          </table></div>
          <div class="count-foot">
            <span>ⓘ Actual + Expired + Waste must be less than or equal to Expected + Extra.</span>
            <span class="saved-note" id="savedNote">Last saved: ${fmtDateTime(AUDIT.updatedAt)}</span>
          </div>
          <div class="pager" id="cPager"></div>
        </section>`;
    }

    function filteredRows() {
      return AUDIT.products.filter((p) => {
        if (cState.location && p.location !== cState.location) return false;
        if (cState.batch && p.batchNo !== cState.batch) return false;
        if (cState.status !== 'all' && computeRow(p).status !== cState.status) return false;
        if (cState.q) {
          const hay = (p.name + ' ' + p.sku + ' ' + p.batchNo).toLowerCase();
          if (!hay.includes(cState.q.toLowerCase())) return false;
        }
        return true;
      });
    }

    function renderKpis() {
      const t = auditTotals(AUDIT);
      const varPct = t.expected ? (t.variance / t.expected) * 100 : 0;
      const missPct = t.expected ? (t.missing / t.expected) * 100 : 0;
      const extraPct = t.expected ? (t.extra / t.expected) * 100 : 0;
      const kpi = (tile, icon, label, value, foot) => `
        <div class="kpi"><div class="top"><div class="tile ${tile}">${svg(icon)}</div><div class="label">${label}</div></div>
          <div class="value">${value}</div><div class="foot">${foot}</div></div>`;
      document.getElementById('kpis').innerHTML =
        kpi('blue', 'box', 'Total Products', t.total, `<span class="sub">Counted: ${t.counted} (${t.pct}%)</span>`) +
        kpi('purple', 'db', 'Total Expected', fmtQty(t.expected), '<span class="sub">Base Unit</span>') +
        kpi('green', 'clipboard', 'Total Actual', fmtQty(t.actual), '<span class="sub">Base Unit</span>') +
        kpi('orange', 'chart', 'Total Variance', `<span class="${t.variance < 0 ? 'neg' : t.variance > 0 ? 'pos' : 'zero'}">${fmtQty(t.variance)}</span>`, `<span class="${t.variance < 0 ? 'neg' : 'pos'}">${fmtPct(varPct)}</span>`) +
        kpi('red', 'list', 'Missing', `<span class="neg">${fmtQty(t.missing)}</span>`, `<span class="sub">${missPct.toFixed(2)}%</span>`) +
        kpi('green', 'plus', 'Extra', `<span class="pos">${fmtQty(t.extra)}</span>`, `<span class="sub">${extraPct.toFixed(2)}%</span>`);
    }

    function inputCell(p, field) {
      const v = p[field];
      const dim = (p.actual === null || p.actual === undefined) ? ' dim' : '';
      return `<td class="num"><input class="grid-input${dim}" type="number" min="0" step="0.001"
        data-id="${p.productId}" data-field="${field}" value="${v === null || v === undefined ? '' : v}" /></td>`;
    }

    function renderGrid() {
      const list = filteredRows();
      const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
      if (cState.page > pages) cState.page = pages;
      const start = (cState.page - 1) * PAGE_SIZE;
      const rows = list.slice(start, start + PAGE_SIZE);
      const grid = document.getElementById('grid');

      if (!rows.length) {
        grid.innerHTML = `<tr><td colspan="12" class="empty">No products match these filters.</td></tr>`;
      } else {
        grid.innerHTML = rows.map((p) => {
          const c = computeRow(p);
          return `<tr>
            <td><div><strong>${p.name}</strong></div><div class="sub mono">SKU: ${p.sku}</div></td>
            <td class="mono">${p.batchNo}</td>
            <td class="mono">${p.location}</td>
            <td class="num mono">${fmtQty(p.expected)}</td>
            ${inputCell(p, 'actual')}${inputCell(p, 'expired')}${inputCell(p, 'waste')}${inputCell(p, 'extra')}
            <td class="num mono" id="miss-${p.productId}">${c.missing === null ? '<span class="notice">—</span>' : (c.missing > 0 ? '<span class="neg">' + fmtQty(c.missing) + '</span>' : '<span class="zero">0.000</span>')}</td>
            <td class="num mono" id="var-${p.productId}">${varianceCell(c.variance)}</td>
            <td id="st-${p.productId}">${c.counted ? statusBadge(c.status) : statusBadge('not_counted')}</td>
            <td><button class="row-menu" title="Row actions">⋮</button></td>
          </tr>`;
        }).join('');
      }

      const showFrom = list.length ? start + 1 : 0;
      const showTo = Math.min(start + PAGE_SIZE, list.length);
      let btns = `<button class="page-btn" data-page="prev" ${cState.page === 1 ? 'disabled' : ''}>‹</button>`;
      for (let p = 1; p <= pages; p++) btns += `<button class="page-btn${p === cState.page ? ' active' : ''}" data-page="${p}">${p}</button>`;
      btns += `<button class="page-btn" data-page="next" ${cState.page === pages ? 'disabled' : ''}>›</button>`;
      document.getElementById('cPager').innerHTML =
        `<div class="info">Showing ${showFrom} to ${showTo} of ${list.length} products</div><div class="controls">${btns}</div>`;

      grid.querySelectorAll('input.grid-input').forEach((inp) => inp.addEventListener('input', onEdit));
      document.querySelectorAll('#cPager .page-btn').forEach((b) => b.addEventListener('click', () => {
        const v = b.dataset.page;
        if (v === 'prev') cState.page = Math.max(1, cState.page - 1);
        else if (v === 'next') cState.page = Math.min(pages, cState.page + 1);
        else cState.page = Number(v);
        renderGrid();
      }));
    }

    function onEdit(e) {
      const id = e.target.dataset.id, field = e.target.dataset.field, raw = e.target.value;
      const p = AUDIT.products.find((x) => x.productId === id);
      if (field === 'actual') {
        p.actual = raw === '' ? null : Number(raw);
        if (p.actual !== null && p.expired === null) { p.expired = 0; p.waste = 0; p.extra = 0; }
        if (p.actual === null) { p.expired = null; p.waste = null; p.extra = null; }
      } else {
        p[field] = raw === '' ? 0 : Number(raw);
      }
      const c = computeRow(p);
      const missEl = document.getElementById('miss-' + id);
      const varEl = document.getElementById('var-' + id);
      const stEl = document.getElementById('st-' + id);
      if (missEl) missEl.innerHTML = c.missing === null ? '<span class="notice">—</span>' : (c.missing > 0 ? '<span class="neg">' + fmtQty(c.missing) + '</span>' : '<span class="zero">0.000</span>');
      if (varEl) varEl.innerHTML = varianceCell(c.variance);
      if (stEl) stEl.innerHTML = c.counted ? statusBadge(c.status) : statusBadge('not_counted');
      e.target.classList.toggle('dim', p.actual === null || p.actual === undefined);
      if (!c.valid) e.target.style.borderColor = 'var(--red)'; else e.target.style.borderColor = '';
      renderKpis();
      persist();
    }

    function distinct(arr, key) { return [...new Set(arr.map((x) => x[key]))]; }

    function submit() {
      const invalid = AUDIT.products.filter((p) => !computeRow(p).valid);
      if (invalid.length) { toast(invalid.length + ' row(s) break the balance rule — fix the red cells first.'); return; }
      const notCounted = AUDIT.products.filter((p) => !computeRow(p).counted).length;
      AUDIT.status = 'submitted'; AUDIT.submittedAt = nowIso(); AUDIT.updatedAt = nowIso();
      saveStore(STORE);
      toast('Audit submitted' + (notCounted ? ' (' + notCounted + ' product(s) left uncounted).' : '.') + ' Returning to sessions…');
      setTimeout(() => location.href = 'audit-sessions.html', 1400);
    }

    loadStore().then((s) => {
      STORE = s;
      AUDIT = byId(s.audits, qp('id', 'AUD-2405-012')) || byId(s.audits, 'AUD-2405-012');
      const user = byId(s.users, AUDIT.auditorUserId) || s.counterUser;
      const userChip = { name: user.name, role: user.role, initials: user.name.split(' ').map((w) => w[0]).join('').slice(0, 2) };

      const hasGrid = AUDIT.products && AUDIT.products.length;
      document.getElementById('content').innerHTML = hasGrid ? skeleton() : missingPanel();
      renderShell('audit-sessions', { user: userChip, crumbs: [
        { label: 'Audit Sessions', href: 'audit-sessions.html' },
        { label: AUDIT.id, href: 'audit-counting.html?id=' + AUDIT.id },
        { label: hasGrid ? 'Audit Counting' : AUDIT.name },
      ] });
      if (!hasGrid) return;

      // Filters
      const locSel = document.getElementById('cLocation');
      locSel.innerHTML = '<option value="">All Locations</option>' + distinct(AUDIT.products, 'location').sort().map((l) => `<option value="${l}">${l}</option>`).join('');
      const batchSel = document.getElementById('cBatch');
      batchSel.innerHTML = '<option value="">All Batches</option>' + distinct(AUDIT.products, 'batchNo').sort().map((b) => `<option value="${b}">${b}</option>`).join('');
      document.getElementById('cSearch').addEventListener('input', (e) => { cState.q = e.target.value; cState.page = 1; renderGrid(); });
      locSel.addEventListener('change', (e) => { cState.location = e.target.value; cState.page = 1; renderGrid(); });
      batchSel.addEventListener('change', (e) => { cState.batch = e.target.value; cState.page = 1; renderGrid(); });
      document.getElementById('cStatus').addEventListener('change', (e) => { cState.status = e.target.value; cState.page = 1; renderGrid(); });
      document.getElementById('cClear').addEventListener('click', () => {
        cState = { q: '', location: '', batch: '', status: 'all', page: 1 };
        document.getElementById('cSearch').value = ''; locSel.value = ''; batchSel.value = ''; document.getElementById('cStatus').value = 'all';
        renderGrid();
      });

      // Actions
      document.getElementById('saveBtn').addEventListener('click', () => {
        persist();
        document.getElementById('savedNote').textContent = 'Last saved: ' + fmtDateTime(AUDIT.updatedAt);
        toast('Draft saved.');
      });
      document.getElementById('pauseBtn').addEventListener('click', (e) => {
        if (AUDIT.status === 'paused') { AUDIT.status = 'in_progress'; e.target.textContent = 'Pause Audit'; toast('Audit resumed.'); }
        else { AUDIT.status = 'paused'; e.target.textContent = 'Resume Audit'; toast('Audit paused.'); }
        persist();
      });
      document.getElementById('submitBtn').addEventListener('click', submit);

      renderKpis();
      renderGrid();
    });
  </script>
</body>
</html>
